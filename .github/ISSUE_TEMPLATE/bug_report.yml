name: Bug report
description: Something is broken or behaves differently than expected.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Data source
      description: Does it happen with mock data (`VITE_MSW=true`) or against staging?
      options:
        - Mock data (MSW)
        - Staging API
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Firefox 130 on Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or console output
      description: Remove tokens, emails and any other personal data first.
